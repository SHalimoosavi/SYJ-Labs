name: SYJ LABS quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: npm run validate:html

      - name: Prepare local link validation copy
        run: |
          rm -rf /tmp/syj-link-check
          cp -a dist /tmp/syj-link-check
          find /tmp/syj-link-check -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' \) -print0 \
            | xargs -0 sed -i 's#https://shalimoosavi.github.io/SYJ-Labs/#/#g; s#/SYJ-Labs/#/#g'

      - name: Validate internal and external links
        run: |
          npx http-server /tmp/syj-link-check -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &
          sleep 2
          npx --yes linkinator http://127.0.0.1:4173/ --recurse --silent

  accessibility:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Start local accessibility server
        run: npx http-server dist -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &

      - run: npx pa11y http://127.0.0.1:4173/index.html --config ./pa11y.json && npx pa11y http://127.0.0.1:4173/projects/index.html --config ./pa11y.json

  lighthouse:
    runs-on: ubuntu-latest
    needs: static
    strategy:
      matrix:
        mode: [mobile, desktop]

    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate temporary local TLS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/syj-key.pem \
            -out /tmp/syj-cert.pem \
            -days 1 \
            -subj '/CN=127.0.0.1'

      - name: Start local HTTPS Lighthouse server
        run: npx http-server dist -S -C /tmp/syj-cert.pem -K /tmp/syj-key.pem -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &

      - run: sleep 2 && npx lhci autorun --config=lighthouserc.${{ matrix.mode }}.json
