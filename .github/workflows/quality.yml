name: SYJ LABS quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test license mapping fixture
        run: npm run test:license-mapping
      - run: npm run build
      - run: npm run verify:dist
      - run: npm run validate:html
      - name: Prepare local link validation copy
        run: |
          rm -rf /tmp/syj-link-check
          cp -a dist /tmp/syj-link-check
          find /tmp/syj-link-check -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' \) -print0 \
            | xargs -0 sed -i 's#https://shalimoosavi.github.io/SYJ-Labs/#/#g; s#/SYJ-Labs/#/#g'
      - name: Validate internal and external links
        run: |
          npx http-server /tmp/syj-link-check -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &
          sleep 2
          npx --yes linkinator http://127.0.0.1:4173/ --recurse --silent

  accessibility:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Start local accessibility server
        run: npx http-server dist -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &
      - name: Run Pa11y on representative pages
        run: |
          npx pa11y http://127.0.0.1:4173/index.html --config ./pa11y.json
          npx pa11y http://127.0.0.1:4173/projects/index.html --config ./pa11y.json
          npx pa11y http://127.0.0.1:4173/projects/syj-llm/index.html --config ./pa11y.json

  lighthouse:
    name: Lighthouse PR gate
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        mode: [mobile, desktop]
    steps:
      - uses: actions/checkout@v5
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Start local Lighthouse server
        run: npx http-server dist -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &
      - name: Run Lighthouse three times
        run: npx lhci autorun --config=lighthouserc.pr.${{ matrix.mode }}.json
      - name: Report Lighthouse medians and failing audits
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const files = fs.existsSync('.lighthouseci')
            ? fs.readdirSync('.lighthouseci').filter(name => name.endsWith('.json'))
            : [];
          const reports = [];
          for (const name of files) {
            try {
              const report = JSON.parse(fs.readFileSync(path.join('.lighthouseci', name), 'utf8'));
              if (report.requestedUrl && report.categories) reports.push(report);
            } catch {}
          }
          const median = values => {
            const sorted = values.filter(Number.isFinite).sort((a,b)=>a-b);
            if (!sorted.length) return null;
            const middle = Math.floor(sorted.length / 2);
            return sorted.length % 2 ? sorted[middle] : (sorted[middle-1] + sorted[middle]) / 2;
          };
          const metric = (rows, id) => median(rows.map(r => r.audits?.[id]?.numericValue));
          const urls = [...new Set(reports.map(r => r.requestedUrl))];
          for (const url of urls) {
            const rows = reports.filter(r => r.requestedUrl === url);
            const performance = median(rows.map(r => r.categories.performance?.score));
            const accessibility = median(rows.map(r => r.categories.accessibility?.score));
            const best = median(rows.map(r => r.categories['best-practices']?.score));
            const seo = median(rows.map(r => r.categories.seo?.score));
            console.log(`Lighthouse median | ${url} | performance=${performance ?? 'unverified'} accessibility=${accessibility ?? 'unverified'} best-practices=${best ?? 'unverified'} seo=${seo ?? 'unverified'}`);
            console.log(`Core metrics | ${url} | LCP_ms=${metric(rows,'largest-contentful-paint') ?? 'unverified'} TBT_ms=${metric(rows,'total-blocking-time') ?? 'unverified'} CLS=${metric(rows,'cumulative-layout-shift') ?? 'unverified'} FCP_ms=${metric(rows,'first-contentful-paint') ?? 'unverified'} SpeedIndex_ms=${metric(rows,'speed-index') ?? 'unverified'} TotalByteWeight_bytes=${metric(rows,'total-byte-weight') ?? 'unverified'} DOM_size=${metric(rows,'dom-size') ?? 'unverified'}`);
            const candidates = [];
            const auditIds = new Set(rows.flatMap(r => Object.keys(r.audits || {})));
            for (const id of auditIds) {
              const audits = rows.map(r => r.audits?.[id]).filter(Boolean);
              const scores = audits.map(a => a.score).filter(v => typeof v === 'number');
              const score = median(scores);
              const savings = median(audits.map(a => a.details?.overallSavingsMs).filter(Number.isFinite));
              if ((score !== null && score < 0.9) || (savings !== null && savings > 0)) {
                const title = audits.find(a => a.title)?.title || id;
                candidates.push({id,title,score,savings});
              }
            }
            candidates.sort((a,b)=>(b.savings ?? 0)-(a.savings ?? 0));
            console.log(`Top Lighthouse opportunities | ${url}`);
            for (const item of candidates.slice(0,12)) {
              console.log(`  ${item.id} | ${item.title} | score=${item.score ?? 'unverified'} | savings_ms=${item.savings ?? 'unverified'}`);
            }
            const medianReport = rows[Math.floor(rows.length / 2)];
            for (const id of ['cls-culprits-insight','layout-shifts']) {
              const audit = medianReport?.audits?.[id];
              if (!audit?.details?.items) continue;
              console.log(`Diagnostic detail | ${url} | ${id}`);
              console.log(JSON.stringify(audit.details.items.slice(0,12), null, 2));
            }
          }
          NODE
