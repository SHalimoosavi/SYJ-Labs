name: SYJ LABS quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: npm run verify:dist

      - name: Prove missing CSS fails verification, then rebuild
        shell: bash
        run: |
          set -euo pipefail
          saved="${RUNNER_TEMP}/site.css"
          mv dist/assets/site.css "$saved"
          if npm run verify:dist; then
            mv "$saved" dist/assets/site.css
            echo "ERROR: verifier passed while required CSS was missing."
            exit 1
          else
            echo "EXPECTED FAILURE: verifier rejected the missing stylesheet."
          fi
          mv "$saved" dist/assets/site.css
          npm run build
          npm run verify:dist

      - run: npm run validate:html

      - run: ln -s . dist/SYJ-Labs

      - run: npx http-server dist -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &

      - run: sleep 2 && npx --yes linkinator http://127.0.0.1:4173/SYJ-Labs/ --recurse --silent

      - name: Check responsive widths and capture screenshots
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/syj-labs-responsive
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(find "$HOME/.cache/puppeteer" -type f -name chrome -print -quit)"
          if [ -z "$CHROME_BIN" ]; then
            echo "ERROR: Puppeteer Chrome executable was not found."
            exit 1
          fi
          export CHROME_BIN
          node scripts/verify-responsive.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syj-labs-responsive-screenshots
          path: ${{ runner.temp }}/syj-labs-responsive/
          if-no-files-found: warn


  accessibility:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: npm run verify:dist

      - run: ln -s . dist/SYJ-Labs

      - run: npx http-server dist -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &

      - run: sleep 2 && npx pa11y http://127.0.0.1:4173/SYJ-Labs/ --standard WCAG2AA && npx pa11y http://127.0.0.1:4173/SYJ-Labs/projects/ --standard WCAG2AA

  lighthouse:
    runs-on: ubuntu-latest
    needs: static
    strategy:
      matrix:
        mode: [mobile, desktop]

    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: npm run verify:dist

      - run: ln -s . dist/SYJ-Labs

      - run: npx http-server dist -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &

      - run: sleep 2 && npx lhci autorun --config=lighthouserc.${{ matrix.mode }}.json

      - name: Print Lighthouse scores and failing audits
        if: always()
        run: node scripts/summarize-lighthouse.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ matrix.mode }}-results
          path: .lighthouseci/
          if-no-files-found: warn
