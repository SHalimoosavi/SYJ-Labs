name: SYJ LABS quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run validate:html
      - run: ln -s . dist/SYJ-Labs
      - run: npx http-server dist -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &
      - run: sleep 2 && npx --yes linkinator http://127.0.0.1:4173/SYJ-Labs/ --recurse --silent

  accessibility:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: ln -s . dist/SYJ-Labs
      - run: npx http-server dist -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &
      - run: sleep 2 && npx pa11y http://127.0.0.1:4173/SYJ-Labs/ --standard WCAG2AA && npx pa11y http://127.0.0.1:4173/SYJ-Labs/projects/ --standard WCAG2AA

  lighthouse:
    runs-on: ubuntu-latest
    needs: static
    strategy:
      matrix:
        mode: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: ln -s . dist/SYJ-Labs
      - run: npx http-server dist -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &
      - run: sleep 2 && npx lhci autorun --config=lighthouserc.${{ matrix.mode }}.json
