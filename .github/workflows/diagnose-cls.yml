name: SYJ LABS desktop CLS diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start local site
        run: npx http-server dist -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &
      - name: Install Puppeteer Core without saving
        run: npm install --no-save --no-audit --no-fund puppeteer-core
      - name: Set CHROME_PATH from Lighthouse Chrome launcher
        run: |
          CHROME_PATH="$(node -e "const c=require('chrome-launcher'); process.stdout.write(c.Launcher.getFirstInstallation())")"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "Using Chrome: $CHROME_PATH"
      - name: Record desktop layout shifts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const puppeteer = require('puppeteer-core');

          const url = 'http://127.0.0.1:4173/index.html';
          const output = '/tmp/cls-diagnostic.json';
          const events = [];

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: 'new',
            defaultViewport: { width: 1350, height: 940, deviceScaleFactor: 1 },
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });

          const page = await browser.newPage();
          await page.evaluateOnNewDocument(() => {
            window.__syjCls = { shifts: [], mutations: [], classChanges: [], resourceSnapshot: [] };
            const originalObserve = PerformanceObserver;
            window.__syjObserversInstalled = true;
            new originalObserve(list => {
              for (const entry of list.getEntries()) {
                if (entry.entryType !== 'layout-shift' || entry.hadRecentInput) continue;
                const sources = (entry.sources || []).map(source => {
                  const n = source.node;
                  return {
                    node: n ? { tag: n.tagName, id: n.id, class: n.className, text: (n.textContent || '').trim().slice(0, 120) } : null,
                    previousRect: source.previousRect ? { x: source.previousRect.x, y: source.previousRect.y, width: source.previousRect.width, height: source.previousRect.height } : null,
                    currentRect: source.currentRect ? { x: source.currentRect.x, y: source.currentRect.y, width: source.currentRect.width, height: source.currentRect.height } : null
                  };
                });
                window.__syjCls.shifts.push({ value: entry.value, startTime: entry.startTime, sources });
              }
            }).observe({ type: 'layout-shift', buffered: true });

            const resourceObserver = new PerformanceObserver(list => {
              for (const entry of list.getEntries()) {
                if (['resource'].includes(entry.entryType)) {
                  window.__syjCls.resourceSnapshot.push({ name: entry.name, initiatorType: entry.initiatorType, responseEnd: entry.responseEnd, startTime: entry.startTime });
                }
              }
            });
            resourceObserver.observe({ type: 'resource', buffered: true });

            const originalAppend = Node.prototype.appendChild;
            const originalInsertBefore = Node.prototype.insertBefore;
            const originalReplace = Element.prototype.replaceChildren;
            const recordMutation = (kind, target, node) => {
              window.__syjCls.mutations.push({ kind, time: performance.now(), target: target && target.outerHTML ? target.outerHTML.slice(0, 220) : String(target), node: node && node.outerHTML ? node.outerHTML.slice(0, 220) : String(node) });
            };
            Node.prototype.appendChild = function(node) { recordMutation('appendChild', this, node); return originalAppend.call(this, node); };
            Node.prototype.insertBefore = function(node, ref) { recordMutation('insertBefore', this, node); return originalInsertBefore.call(this, node, ref); };
            Element.prototype.replaceChildren = function(...nodes) { recordMutation('replaceChildren', this, nodes.join('')); return originalReplace.call(this, ...nodes); };

            const classProto = DOMTokenList.prototype;
            for (const method of ['add', 'remove', 'toggle']) {
              const original = classProto[method];
              classProto[method] = function(...tokens) {
                window.__syjCls.classChanges.push({ method, time: performance.now(), element: this.ownerElement ? { tag: this.ownerElement.tagName, id: this.ownerElement.id, class: this.ownerElement.className } : null, tokens });
                return original.apply(this, tokens);
              };
            }
          });

          await page.goto(url, { waitUntil: 'networkidle2' });
          await new Promise(resolve => setTimeout(resolve, 1500));

          const result = await page.evaluate(() => ({
            shifts: window.__syjCls.shifts,
            mutations: window.__syjCls.mutations,
            classChanges: window.__syjCls.classChanges,
            resources: performance.getEntriesByType('resource').map(entry => ({
              name: entry.name,
              initiatorType: entry.initiatorType,
              startTime: entry.startTime,
              responseEnd: entry.responseEnd,
              duration: entry.duration
            }))
          }));

          fs.writeFileSync(output, JSON.stringify(result, null, 2));

          const interestingResources = result.resources.filter(r => /font|\.woff|\.woff2|\.ttf|\.otf|\.css(?:$|\?)|\.js(?:$|\?)|\.webp|\.png|\.jpe?g|\.svg(?:$|\?)/i.test(r.name));
          const mutations = result.mutations;
          const classes = result.classChanges;

          console.log('\nLAYOUT-SHIFT TABLE');
          console.log('value\tstartTime_ms\tnode\tpreviousRect\tcurrentRect\tpreceding_event');
          for (const shift of result.shifts) {
            for (const source of shift.sources.length ? shift.sources : [{ node: null, previousRect: null, currentRect: null }]) {
              const nodeText = source.node ? `${source.node.tag}${source.node.id ? '#' + source.node.id : ''}${source.node.class ? '.' + String(source.node.class).replace(/\s+/g, '.') : ''}` : 'unknown';
              const priorMutations = mutations.filter(m => m.time <= shift.startTime);
              const priorClasses = classes.filter(c => c.time <= shift.startTime);
              const priorResources = interestingResources.filter(r => r.responseEnd <= shift.startTime);
              const event = [
                ...priorMutations.map(m => ({ time: m.time, label: `${m.kind} ${m.target}` })),
                ...priorClasses.map(c => ({ time: c.time, label: `class.${c.method} ${JSON.stringify(c.tokens)}` })),
                ...priorResources.map(r => ({ time: r.responseEnd, label: `${r.initiatorType} ${r.name}` }))
              ].sort((a,b) => b.time - a.time)[0];
              console.log(`${shift.value}\t${shift.startTime}\t${nodeText}\t${JSON.stringify(source.previousRect)}\t${JSON.stringify(source.currentRect)}\t${event ? `${event.label} @ ${event.time}ms` : 'none captured'}`);
            }
          }

          console.log('\nRESOURCE TIMINGS (fonts/images/CSS/JS)');
          for (const r of interestingResources) console.log(`${r.responseEnd}ms\t${r.initiatorType}\t${r.name}`);

          console.log('\nDOM MUTATIONS');
          for (const m of mutations) console.log(`${m.time}ms\t${m.kind}\t${m.target}\t${m.node}`);

          console.log('\nCLASS CHANGES');
          for (const c of classes) console.log(`${c.time}ms\t${c.method}\t${c.element ? JSON.stringify(c.element) : 'unknown'}\t${c.tokens.join(',')}`);

          await browser.close();
          NODE
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cls-diagnostic
          path: /tmp/cls-diagnostic.json
