name: Build and deploy SYJ LABS

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Mount GitHub Pages base path for artifact validation
        run: ln -s . dist/SYJ-Labs

      - name: Verify deployment artifact
        run: npm run verify:dist

      - name: Validate generated HTML
        run: npm run validate:html

      # Validate the built artifact locally. Canonical/OG metadata intentionally
      # points at the future production Pages URL, which can be unavailable while
      # this build is being created, so rewrite that origin only in the test copy.
      - name: Prepare local link validation copy
        run: |
          rm -rf /tmp/syj-link-check
          cp -a dist /tmp/syj-link-check
          find /tmp/syj-link-check -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' \) -print0 \
            | xargs -0 sed -i 's#https://shalimoosavi.github.io/SYJ-Labs/#/#g; s#/SYJ-Labs/#/#g'

      - name: Validate internal and external links
        run: |
          npx http-server /tmp/syj-link-check -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &
          sleep 2
          npx --yes linkinator http://127.0.0.1:4173/ --recurse --silent

      - name: Remove validation mount before upload
        run: rm dist/SYJ-Labs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  production-lighthouse:
    name: Lighthouse production gate
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Wait for GitHub Pages propagation
        run: sleep 20

      - name: Run Lighthouse against deployed Pages site
        run: npx lhci autorun --config=lighthouserc.production.${{ matrix.mode }}.json
