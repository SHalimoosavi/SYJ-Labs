name: Build and deploy SYJ LABS

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The generated site intentionally uses the GitHub Pages project prefix
      # (/SYJ-Labs/). Locally, dist/ is the web root, so expose the same prefix
      # during validation without putting a nested directory into the artifact.
      - name: Mount GitHub Pages base path for validation
        run: ln -s . dist/SYJ-Labs

      - name: Verify deployment artifact
        run: npm run verify:dist

      - name: Validate generated HTML
        run: npm run validate:html

      - name: Validate internal and external links
        run: npm run validate:links

      - name: Remove validation mount before upload
        run: rm dist/SYJ-Labs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
