name: Build and deploy SYJ LABS

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify deployment artifact
        run: npm run verify:dist
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate generated HTML
        run: npm run validate:html

      - name: Prepare local link validation copy
        run: |
          rm -rf /tmp/syj-link-check
          cp -a dist /tmp/syj-link-check
          find /tmp/syj-link-check -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' \) -print0 \
            | xargs -0 sed -i 's#https://shalimoosavi.github.io/SYJ-Labs/#/#g; s#/SYJ-Labs/#/#g'

      - name: Validate internal and external links
        run: |
          npx http-server /tmp/syj-link-check -p 4173 -c-1 > /tmp/syj-http.log 2>&1 &
          sleep 2
          npx --yes linkinator http://127.0.0.1:4173/ --recurse --silent

      - name: Remove validation-only files
        run: rm -f dist/SYJ-Labs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  production-lighthouse:
    name: Lighthouse production gate
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [mobile, desktop]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Wait for GitHub Pages propagation
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://shalimoosavi.github.io/SYJ-Labs/"
            "https://shalimoosavi.github.io/SYJ-Labs/projects/"
            "https://shalimoosavi.github.io/SYJ-Labs/projects/syj-llm/"
          )

          for attempt in $(seq 1 60); do
            ready=true
            for url in "${urls[@]}"; do
              if ! curl --fail --silent --show-error --location --output /dev/null "$url"; then
                ready=false
                break
              fi
            done

            if [ "$ready" = true ]; then
              echo "GitHub Pages is serving all Lighthouse targets."
              exit 0
            fi

            echo "Pages propagation still in progress (attempt ${attempt}/60); retrying in 5s..."
            sleep 5
          done

          echo "GitHub Pages did not serve all Lighthouse targets within 5 minutes."
          exit 1

      - name: Run Lighthouse against deployed Pages site
        run: npx lhci autorun --config=lighthouserc.production.${{ matrix.mode }}.json
